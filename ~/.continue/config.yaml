name: Local Assistant
version: 1.0.0
schema: v1
models:
  - name: Llama 3.1 8B
    provider: ollama
    model: llama3.1:8b
    roles:
      - chat
      - edit
      - apply
  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
  - name: DeepSeek Coder
    provider: deepseek
    model: deepseek-coder
    apiKey: sk-66ea59753efd463aa317fc67a89d1707
  - name: Autodetect
    provider: ollama
    model: AUTODETECT
  - name: DeepSeek Coder (1)
    provider: deepseek
    model: deepseek-coder
    apiKey: sk-66ea59753efd463aa317fc67a89d1707

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase

# MCP服务器配置
mcpServers:
  - name: code-change-impact
    command: /home/kotei/miniconda3/envs/sunny/bin/python
    args:
      - /home/kotei/work/neo4j-graphrag-python/mcp_plugin/server.py
    env:
      PYTHONPATH: /home/kotei/work/neo4j-graphrag-python
      PATH: /home/kotei/miniconda3/envs/sunny/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CONDA_DEFAULT_ENV: sunny
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: "" 